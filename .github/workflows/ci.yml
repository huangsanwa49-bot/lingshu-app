name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK 37.2
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - name: 指向 SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: 构建调试版（失败时把编译错误写成注解）
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E "^(e: |.*error: )" build.log | head -50 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $code
